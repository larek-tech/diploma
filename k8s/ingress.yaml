apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: crawler-ingress
spec:
  ingressClassName: traefik
  rules:
  - host: crawler.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: crawler
            port:
              number: 8080

