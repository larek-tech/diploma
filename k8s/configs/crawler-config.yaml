# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: crawler-config
data:
  OLLAMA_HOST: "http://ollama:11434"
  OLLAMA_MODEL: "bge-m3:latest"
  POSTGRES_DB: "master"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  KAFKA_SERVERS: "kafka:9092"
  S3_SSL: "true"
  S3_ENDPOINT: "s3.local"
  TRACING_ENDPOINT: "jaeger:4318"
  OLLAMA_EMBEDDER_ENDPOINT: "http://ollama:11434"

---
# Secret for sensitive configuration
apiVersion: v1
kind: Secret
metadata:
  name: crawler-secrets
type: Opaque
data:
  POSTGRES_PASSWORD: base64
  S3_ACCESS_KEY_ID: base64
  S3_SECRET_ACCESS_KEY: base64